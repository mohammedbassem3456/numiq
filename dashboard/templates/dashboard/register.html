<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Numiq - إنشاء حساب</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0f172a; 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .bg-glow {
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            z-index: 0;
        }
        .glow-1 { background: #6366f1; top: -100px; right: -100px; }
        .glow-2 { background: #8b5cf6; bottom: -100px; left: -100px; }
        .card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 1;
        }
        .logo { 
            font-size: 28px; 
            font-weight: 800; 
            color: #6366f1;
            letter-spacing: -1px;
        }
        .subtitle { color: #64748b; font-size: 14px; margin-top: 6px; }
        .form-label { color: #94a3b8; font-size: 13px; margin-bottom: 6px; }
        .form-control {
            background: rgba(15, 23, 42, 0.8) !important;
            border: 1px solid #334155 !important;
            color: #e2e8f0 !important;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 14px;
            transition: all 0.3s;
        }
        .form-control:focus {
            border-color: #6366f1 !important;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1) !important;
        }
        .btn-register {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            border-radius: 10px;
            padding: 13px;
            font-size: 15px;
            font-weight: 600;
            color: white;
            width: 100%;
            margin-top: 8px;
            transition: all 0.3s;
        }
        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
            color: white;
        }
        .divider { 
            border-color: #334155; 
            margin: 20px 0;
        }
        .login-link { 
            color: #64748b; 
            font-size: 13px; 
            text-align: center;
        }
        .login-link a { color: #6366f1; text-decoration: none; font-weight: 600; }
        .login-link a:hover { color: #818cf8; }
        p { color: #94a3b8; font-size: 13px; margin-bottom: 12px; }
        ul { color: #ef4444; font-size: 12px; padding-right: 16px; margin-bottom: 12px; }
        .feature-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 12px;
            color: #818cf8;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>

    <div class="card">
        <div class="text-center mb-4">
            <div class="logo">📊 Numiq</div>
            <div class="subtitle">منصة تحليلات المتاجر السعودية</div>
            <div class="feature-badge mt-3">
                ✨ مجاني تماماً للبدء
            </div>
        </div>

        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                    <ul>{% for error in field.errors %}<li>{{ error }}</li>{% endfor %}</ul>
                    {% endif %}
                </div>
            {% endfor %}
            <button type="submit" class="btn-register">إنشاء حسابك مجاناً 🚀</button>
        </form>

        <hr class="divider">
        <div class="login-link">
            عندك حساب بالفعل؟ <a href="/accounts/login/">سجل دخول</a>
        </div>
    </div>
</body>
</html>
