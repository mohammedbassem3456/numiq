<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Numiq - ربط المتجر</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #e2e8f0; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; }
        .btn-connect { background: #6366f1; border: none; color: white; }
        .btn-connect:hover { background: #4f46e5; color: white; }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4 text-center">
                <h3 class="fw-bold mb-2" style="color: #6366f1;">📊 Numiq</h3>
                <p class="text-muted mb-4">ربط متجرك على سلة للبدء</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3 text-start">
                        <label class="form-label">API Key من سلة</label>
                        <input type="text" class="form-control bg-dark text-white border-secondary" name="api_key" placeholder="أدخل الـ API Key" required>
                        <small class="text-muted">يمكنك الحصول عليه من إعدادات متجرك على سلة</small>
                    </div>
                    <button type="submit" class="btn btn-connect w-100">ربط المتجر 🔗</button>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
