<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Numiq - تسجيل الدخول</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0f172a; 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .bg-glow {
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            z-index: 0;
        }
        .glow-1 { background: #6366f1; top: -100px; right: -100px; }
        .glow-2 { background: #8b5cf6; bottom: -100px; left: -100px; }
        .card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 1;
        }
        .logo { font-size: 28px; font-weight: 800; color: #6366f1; }
        .subtitle { color: #64748b; font-size: 14px; margin-top: 6px; }
        label { color: #94a3b8; font-size: 13px; display: block; margin-bottom: 6px; }
        input {
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #334155;
            color: #e2e8f0;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 14px;
            margin-bottom: 16px;
            outline: none;
            transition: all 0.3s;
        }
        input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus {
            -webkit-box-shadow: 0 0 0px 1000px rgba(15, 23, 42, 0.8) inset !important;
            -webkit-text-fill-color: #e2e8f0 !important;
        }
        .btn-login {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            border-radius: 10px;
            padding: 13px;
            font-size: 15px;
            font-weight: 600;
            color: white;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
        }
        .register-link { 
            color: #64748b; 
            font-size: 13px; 
            text-align: center;
            margin-top: 16px;
        }
        .register-link a { color: #6366f1; text-decoration: none; font-weight: 600; }
        .divider { border-color: #334155; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>

    <div class="card">
        <div class="text-center mb-4">
            <div class="logo">📊 Numiq</div>
            <div class="subtitle">منصة تحليلات المتاجر السعودية</div>
        </div>

        <form method="post">
            {% csrf_token %}
            <label>اسم المستخدم</label>
            <input type="text" name="username" autofocus>
            <label>كلمة المرور</label>
            <input type="password" name="password">
            <button type="submit" class="btn-login">دخول 🚀</button>
        </form>

        <hr class="divider">
        <div class="register-link">
            ما عندك حساب؟ <a href="/register/">إنشاء حساب مجاناً</a>
        </div>
    </div>
</body>
</html>
